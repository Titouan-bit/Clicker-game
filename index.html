<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="./souris.png">
    <title>Overload</title>
</head>
<body>
    <div id="statsWrapper">
        <div id="statClicks" class="statLine">
            <span>Nombre de clics</span>
            <span class="statValue" id="nombredeclic">0</span>
        </div>
        <div id="statScorePerClick" class="statLine">
            <span>Score par clics</span>
            <span class="statValue" id="ScorePerClickGauche">1</span>
        </div>
        <div id="statAchievements" class="statLine">
            <span>Achievement /10</span>
            <span class="statValue">0</span>
        </div>
    </div>

    <div id="achievementBadge">Achievement</div>

    <div id="deuxboutons">
        <button id="deuxieme"><img src="./sonOn.png" id="IMGrandom"></button>
    </div>

    <div id="scroePerClickDiv">
        <p id="scroePerClick"></p>
    </div>

    <div id="mainButtonWrapper">
        <button id="boutonprincipal">CLIQUEZ MOI !</button>
    </div>

    <div id="fieldsetWrapper">
        <span id="ameliorationTitle">Amélioration</span>
        <fieldset id="fieldsetRunner">
            <div id="upPoule" class="up">
                <p class="pUP">Poule</p>
                <p class="clicksUp">+5 clicks</p>
            </div>
        </fieldset>
    </div>
    <div>
    </div>
    <div class="Achievement" id="Achievement100Click">
        <img src="souris.png" id="imgAchievement100Click">
        <p>Clicker Intermédiaire</p>
        <p>Cliquer 100 fois sur le bouton Principal</p>
    </div>

    <script src="index.js"></script>
</body>
</html>
